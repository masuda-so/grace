name: StoreKit integration validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: storekit-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  storekit:
    name: StoreKit integration on Xcode 27
    runs-on: xcode-27
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Inspect toolchain and select existing simulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          xcodebuild -version | tee artifacts/xcode-version.txt
          xcrun simctl list devices available -j > artifacts/devices.json
          python3 - <<'PYTHON'
          import json, os
          with open('artifacts/devices.json') as stream:
              devices = json.load(stream)['devices']
          candidates = [d for d in devices.get('com.apple.CoreSimulator.SimRuntime.iOS-27-0', [])
                        if d['name'] == 'iPhone 18 Pro' and d.get('isAvailable')]
          if len(candidates) != 1:
              raise SystemExit('Expected one existing iPhone 18 Pro / iOS 27.0; no simulator will be created.')
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('SIMULATOR_ID=' + candidates[0]['udid'] + '\n')
          PYTHON
      - name: Wait for the existing simulator to finish booting
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl bootstatus "$SIMULATOR_ID" -b 2>&1 | tee artifacts/bootstatus.log
      - name: Verify configured products before purchase scenarios
        id: products
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test \
            -project grace.xcodeproj \
            -scheme grace \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            -test-timeouts-enabled YES \
            -maximum-test-execution-time-allowance 60 \
            -only-testing:graceTests/StoreKitIntegrationTests/testConfiguredProductsLoadWithProductionIdentifiers \
            -resultBundlePath artifacts/ConfiguredProducts.xcresult \
            2>&1 | tee artifacts/configured-products.log
      - name: Observe the unfinished-transaction scenario (non-blocking)
        id: isolated_unfinished
        continue-on-error: true
        timeout-minutes: 8
        if: ${{ !cancelled() && steps.products.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test \
            -project grace.xcodeproj \
            -scheme grace \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            -test-timeouts-enabled YES \
            -maximum-test-execution-time-allowance 120 \
            -only-testing:graceTests/StoreKitIntegrationTests/testEntitlementUpdatesProcessesAndFinishesUnfinishedTransaction \
            -resultBundlePath artifacts/IsolatedUnfinished.xcresult \
            2>&1 | tee artifacts/isolated-unfinished.log
      - name: Run eight required StoreKit integration tests
        id: required_scenarios
        if: ${{ !cancelled() && steps.products.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test \
            -project grace.xcodeproj \
            -scheme grace \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            -test-timeouts-enabled YES \
            -maximum-test-execution-time-allowance 120 \
            -only-testing:graceTests/StoreKitIntegrationTests/testAskToBuyReturnsPendingPurchaseOutcome \
            -only-testing:graceTests/StoreKitIntegrationTests/testClientPurchaseReturnsVerifiedEntitlement \
            -only-testing:graceTests/StoreKitIntegrationTests/testConfiguredProductsLoadWithProductionIdentifiers \
            -only-testing:graceTests/StoreKitIntegrationTests/testDailyPassRepurchaseUsesLatestSignedPurchaseDate \
            -only-testing:graceTests/StoreKitIntegrationTests/testDailyPassUsesPurchaseDateAndInjectedClockAtBoundary \
            -only-testing:graceTests/StoreKitIntegrationTests/testDisablingAutoRenewKeepsAccessUntilSubscriptionExpires \
            -only-testing:graceTests/StoreKitIntegrationTests/testRefundRemovesMonthlyEntitlement \
            -only-testing:graceTests/StoreKitIntegrationTests/testRestoreSynchronizesPurchasedEntitlementIntoFreshClient \
            -resultBundlePath artifacts/StoreKitIntegration.xcresult \
            2>&1 | tee artifacts/storekit-test.log
          xcrun xcresulttool get test-results summary \
            --path artifacts/StoreKitIntegration.xcresult --compact \
            > artifacts/required-summary.json
          python3 - <<'PYTHON'
          import json
          with open('artifacts/required-summary.json') as source:
              summary = json.load(source)
          actual = tuple(summary.get(key) for key in
                         ('totalTestCount', 'passedTests', 'failedTests', 'skippedTests'))
          if actual != (8, 8, 0, 0):
              raise SystemExit(f'Expected eight required tests to pass without skips; got {actual}')
          print('Verified eight required tests passed without skips.')
          PYTHON
      - name: Record required and observational results
        if: ${{ !cancelled() }}
        env:
          PRODUCTS_OUTCOME: ${{ steps.products.outcome }}
          STREAM_OUTCOME: ${{ steps.isolated_unfinished.outcome }}
          REQUIRED_OUTCOME: ${{ steps.required_scenarios.outcome }}
        shell: bash
        run: |
          {
            printf '## StoreKit validation\n\n'
            printf '| Stage | Actual step outcome | Policy |\n'
            printf '| --- | --- | --- |\n'
            printf '| Product loading | %s | Required |\n' "$PRODUCTS_OUTCOME"
            printf '| Eight scenarios | %s | Required |\n' "$REQUIRED_OUTCOME"
            printf '| Unfinished-transaction stream | %s | Observation only |\n' "$STREAM_OUTCOME"
            printf '\nThe stream test still runs with its strict assertions. A green job does not establish that the stream passed. See artifacts and Docs/Structure.md#unresolved-stream-validation.\n'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$STREAM_OUTCOME" != 'success' ]]; then
            printf '::warning::The observational stream step did not succeed; see its actual outcome and artifacts.\n'
          fi
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grace-storekit-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn
